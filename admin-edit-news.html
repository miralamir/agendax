<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Novedad - Admin BAMARTE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Lato', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100">

    <div class="container mx-auto p-4 md:p-8">
        <header class="mb-8">
            <h1 class="text-3xl font-black text-gray-800">Editar Novedad</h1>
            <p class="text-gray-500">Modifica los campos y guarda los cambios.</p>
        </header>

        <form id="edit-news-form" class="bg-white p-8 rounded-2xl shadow-lg space-y-6">
            
            <!-- Contenido de la Noticia -->
            <div class="border-b pb-6">
                <h2 class="text-xl font-bold mb-4">Contenido de la Noticia</h2>
                <div>
                    <label for="title" class="block font-semibold mb-1">Titular</label>
                    <input type="text" id="title" class="w-full p-2 border rounded-md" required>
                </div>
                <div class="mt-4">
                    <label for="summary" class="block font-semibold mb-1">Resumen</label>
                    <textarea id="summary" rows="3" class="w-full p-2 border rounded-md" required></textarea>
                </div>
                <div class="mt-4">
                    <label for="content" class="block font-semibold mb-1">Contenido Completo</label>
                    <textarea id="content" rows="10" class="w-full p-2 border rounded-md" required></textarea>
                </div>
                <div class="mt-4">
                    <label for="mainImageUrl" class="block font-semibold mb-1">URL de la Imagen Principal</label>
                    <input type="url" id="mainImageUrl" class="w-full p-2 border rounded-md" required>
                </div>
            </div>

            <!-- Galería de Imágenes -->
            <div class="border-b pb-6">
                <h2 class="text-xl font-bold mb-4">Galería de Imágenes</h2>
                <div id="gallery-container" class="space-y-4">
                    <!-- Los campos de la galería se llenarán con JS -->
                </div>
                <button type="button" id="add-gallery-item-btn" class="mt-4 text-sm text-purple-600 font-semibold hover:underline">+ Añadir Imagen a la Galería</button>
            </div>

            <!-- Categorización -->
            <div>
                <h2 class="text-xl font-bold mb-4">Categorización y Visibilidad</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="category" class="block font-semibold mb-1">Categoría</label>
                        <select id="category" class="w-full p-2 border rounded-md">
                            <option value="arte">Arte</option>
                            <option value="musica">Música</option>
                            <option value="teatro">Teatro</option>
                            <option value="cine">Cine</option>
                            <option value="literatura">Literatura</option>
                        </select>
                    </div>
                </div>
                <div class="flex items-center space-x-8 mt-6">
                    <label class="flex items-center space-x-2">
                        <input type="checkbox" id="isPublished" class="h-5 w-5 rounded">
                        <span>Publicar Noticia</span>
                    </label>
                    <label class="flex items-center space-x-2">
                        <input type="checkbox" id="isFeatured" class="h-5 w-5 rounded">
                        <span>Marcar como Destacada</span>
                    </label>
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="flex justify-end space-x-4 pt-6">
                <a href="admin-news-dashboard.html" class="bg-gray-200 text-gray-800 font-bold py-2 px-6 rounded-lg hover:bg-gray-300">Cancelar</a>
                <button type="submit" class="bg-cyan-500 text-white font-bold py-2 px-6 rounded-lg hover:bg-cyan-600">Actualizar Novedad</button>
            </div>
            <div id="success-message" class="text-green-600 font-bold text-center mt-4"></div>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBWlNhxc1smYH8szpjpXLMbjPXHIts-nMc",
            authDomain: "zumaq-8bcaa.firebaseapp.com",
            projectId: "zumaq-8bcaa",
            storageBucket: "zumaq-8bcaa.firebasestorage.app",
            messagingSenderId: "812019183354",
            appId: "1:812019183354:web:05a6904d4c5491c4fb2343",
            measurementId: "G-DJJS3XS1RL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const form = document.getElementById('edit-news-form');
        const successMessage = document.getElementById('success-message');
        const galleryContainer = document.getElementById('gallery-container');
        const addGalleryItemBtn = document.getElementById('add-gallery-item-btn');
        let newsId = null;

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'admin-login.html';
            }
        });

        addGalleryItemBtn.addEventListener('click', () => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'flex items-center space-x-2 p-2 border rounded-md';
            itemDiv.innerHTML = `
                <div class="flex-grow space-y-2">
                    <input type="url" name="galleryUrl" class="w-full p-2 border rounded-md" placeholder="URL de la imagen" required>
                    <input type="text" name="galleryDesc" class="w-full p-2 border rounded-md" placeholder="Descripción de la imagen">
                </div>
                <button type="button" class="remove-btn text-red-500 hover:text-red-700 font-bold">X</button>
            `;
            galleryContainer.appendChild(itemDiv);
        });

        galleryContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('remove-btn')) {
                e.target.parentElement.remove();
            }
        });

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            newsId = params.get('id');
            if (!newsId) {
                alert("No se especificó un ID de noticia para editar.");
                window.location.href = 'admin-news-dashboard.html';
                return;
            }

            const docRef = doc(db, "news", newsId);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const news = docSnap.data();
                form.title.value = news.title;
                form.summary.value = news.summary;
                form.content.value = news.content;
                form.mainImageUrl.value = news.mainImageUrl;
                form.category.value = news.category;
                form.isPublished.checked = news.isPublished;
                form.isFeatured.checked = news.isFeatured;

                galleryContainer.innerHTML = '';
                if(news.gallery && news.gallery.length > 0) {
                    news.gallery.forEach(item => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'flex items-center space-x-2 p-2 border rounded-md';
                        itemDiv.innerHTML = `
                            <div class="flex-grow space-y-2">
                                <input type="url" name="galleryUrl" class="w-full p-2 border rounded-md" value="${item.url}" required>
                                <input type="text" name="galleryDesc" class="w-full p-2 border rounded-md" value="${item.description || ''}">
                            </div>
                            <button type="button" class="remove-btn text-red-500 hover:text-red-700 font-bold">X</button>
                        `;
                        galleryContainer.appendChild(itemDiv);
                    });
                }

            } else {
                alert("No se encontró la noticia.");
                window.location.href = 'admin-news-dashboard.html';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const galleryItems = [];
            const galleryUrlInputs = form.querySelectorAll('input[name="galleryUrl"]');
            const galleryDescInputs = form.querySelectorAll('input[name="galleryDesc"]');
            for (let i = 0; i < galleryUrlInputs.length; i++) {
                if (galleryUrlInputs[i].value) {
                    galleryItems.push({
                        url: galleryUrlInputs[i].value,
                        description: galleryDescInputs[i].value
                    });
                }
            }

            const updatedData = {
                title: form.title.value,
                summary: form.summary.value,
                content: form.content.value,
                mainImageUrl: form.mainImageUrl.value,
                category: form.category.value,
                isPublished: form.isPublished.checked,
                isFeatured: form.isFeatured.checked,
                gallery: galleryItems
            };

            try {
                const newsRef = doc(db, "news", newsId);
                await updateDoc(newsRef, updatedData);
                
                successMessage.textContent = '¡Noticia actualizada con éxito! Redirigiendo...';
                setTimeout(() => {
                    window.location.href = 'admin-news-dashboard.html';
                }, 2000);

            } catch (error) {
                console.error("Error al actualizar la noticia: ", error);
                alert("Error al actualizar la noticia. Revisa la consola para más detalles.");
            }
        });
    </script>
</body>
</html>
